<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f4f5f4">
    <meta name="description" content="Курс за курсом — ваше пространство обучения. Курсы, личный план, прогресс и сертификаты в одном месте.">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>Курс за курсом — ваше пространство обучения</title>
    <script>
      try {
        const key = 'aitu-course-tracker:theme:' + location.pathname.replace(/\/[^/]*$/, '/');
        const preference = localStorage.getItem(key) || 'system';
        document.documentElement.dataset.theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
